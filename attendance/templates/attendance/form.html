{% extends "attendance/base.html" %}
{% load static %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" class="card stack">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Save</button>
  <a class="btn secondary" href="{{ cancel_url }}">Cancel</a>
</form>
{% endblock %}
