{% extends "attendance/base.html" %}
{% load static %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" class="card">
  {% csrf_token %}
  <p>{{ object }}</p>
  {% if warning %}<div class="msg error">{{ warning }}</div>{% endif %}
  <p class="muted">This can't be undone.</p>
  <button class="btn danger" type="submit">Yes, delete</button>
  <a class="btn secondary" href="{{ cancel_url }}">Cancel</a>
</form>
{% endblock %}
